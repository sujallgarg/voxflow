services:
  # VoxFlow API Service (Node.js / Fastify)
  - type: web
    name: voxflow-api
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @voxflow/api build
    startCommand: pnpm --filter @voxflow/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        sync: false
      - key: AUTH_ENFORCE
        value: "true"
      - key: AUTH_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_PRODUCT_ID
        sync: false
      - key: DODO_PAYMENTS_ENVIRONMENT
        sync: false
      - key: CHROME_EXTENSION_ID
        sync: false

  # VoxFlow Web Client (Vite Static Site)
  - type: web
    name: voxflow-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @voxflow/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://voxflow-u7h3.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
