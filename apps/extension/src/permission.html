<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VoxFlow - Microphone Permission</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #09090b;
        color: #fafafa;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 14px;
        padding: 32px;
        max-width: 440px;
        width: 100%;
        text-align: center;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #818cf8;
        color: white;
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      p {
        margin: 0 0 24px;
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        width: 100%;
        padding: 13px;
        border: 0;
        border-radius: 10px;
        background: white;
        color: #09090b;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .message {
        margin-top: 16px;
        font-size: 13px;
        min-height: 20px;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">V</div>
      <h1>Microphone Permission</h1>
      <p>VoxFlow needs access to your microphone to transcribe speech and insert text anywhere.</p>
      <button id="grant-btn" type="button">Grant Microphone Permission</button>
      <div id="msg" class="message"></div>
    </div>
    <script type="module" src="permission.js"></script>
  </body>
</html>
