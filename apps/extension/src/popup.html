<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>VoxFlow</title>

    <link
      rel="stylesheet"
      href="popup.css"
    />
  </head>

  <body>
    <main class="popup">

      <div class="brand">
        <div class="logo">
          V
        </div>

        <div>
          <h1>VoxFlow</h1>

          <p>
            Speak naturally. Type anywhere.
          </p>
        </div>
      </div>

      <div class="status">
        <span class="status-dot"></span>

        <span>
          Extension connected
        </span>
      </div>

      <button
        id="record-button"
        type="button"
      >
        <span id="record-icon">🎙</span>

        <span id="record-text">
          Start speaking
        </span>
      </button>
      <button
  id="tab-audio-button"
  type="button"
>
  🔊 Listen to Tab
</button>

      <div
        id="transcript-container"
        class="transcript-container hidden"
      >
        <div class="section-label">
          Transcript
        </div>

        <div
          id="transcript"
          class="transcript"
        ></div>
      </div>



      <p
        id="message"
        class="message"
      ></p>

    </main>

    <script
      type="module"
      src="popup.js"
    ></script>
  </body>
</html>
