<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>
      VoxFlow Extension Test
    </title>

    <style>
      body {
        margin: 0;
        padding: 60px;

        background: #09090b;
        color: white;

        font-family:
          Arial,
          sans-serif;
      }

      .container {
        max-width: 700px;
        margin: auto;
      }

      textarea {
        width: 100%;
        min-height: 200px;

        margin-top: 20px;
        padding: 16px;

        box-sizing: border-box;

        border: 1px solid #3f3f46;
        border-radius: 12px;

        background: #18181b;
        color: white;

        font-size: 16px;
        line-height: 1.6;
      }
    </style>
  </head>

  <body>
    <div class="container">

      <h1>
        VoxFlow Extension Test
      </h1>

      <p>
        Click inside the textarea,
        open VoxFlow, and insert text.
      </p>

      <textarea
        placeholder="Click here..."
      ></textarea>

    </div>
  </body>
</html>
